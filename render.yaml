services:
  - type: web
    name: tbp-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 600 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: RETRAIN_TOKEN        # opsional: kosongkan agar siapa pun bisa training ulang
        sync: false
      - key: MAX_UPLOAD_MB
        value: "20"
